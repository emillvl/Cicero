<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-label="From document to reviewed text"><title>From document to reviewed text</title><rect width="960" height="352" rx="16" fill="#171B1C"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="13" letter-spacing="2" font-weight="700" fill="#BA8B55">CICERO / TECHNICAL REFERENCE</text><text x="32" y="78" font-size="26" font-weight="700" fill="#F2EFE7">From document to reviewed text</text><text x="32" y="105" font-size="15" fill="#C8C6BF">Execution boundaries and the movement of document content</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#BA8B55"/></marker></defs><rect x="32" y="135" width="260" height="151" rx="8" fill="#222829" stroke="#515551"/><text x="48" y="160" font-size="12" fill="#BA8B55" font-weight="700">01 / LOCAL</text><text x="48" y="185" font-size="19" fill="#F2EFE7" font-weight="700">Read &amp; prepare</text><text x="48" y="211" font-size="14" fill="#D7D4CB" font-weight="400">TXT / DOCX / PDF / images</text><text x="48" y="232" font-size="14" fill="#D7D4CB" font-weight="400">OCR and text extraction</text><text x="48" y="253" font-size="14" fill="#D7D4CB" font-weight="400">Ordered source passages</text><rect x="350" y="135" width="260" height="151" rx="8" fill="#222829" stroke="#515551"/><text x="366" y="160" font-size="12" fill="#BA8B55" font-weight="700">02 / SELECTED PROVIDER</text><text x="366" y="185" font-size="19" fill="#F2EFE7" font-weight="700">Translate &amp; review</text><text x="366" y="211" font-size="14" fill="#D7D4CB" font-weight="400">Translator + reviewers</text><text x="366" y="232" font-size="14" fill="#D7D4CB" font-weight="400">Correction and audit</text><text x="366" y="253" font-size="14" fill="#D7D4CB" font-weight="400">Explicit retry on failure</text><rect x="668" y="135" width="260" height="151" rx="8" fill="#222829" stroke="#515551"/><text x="684" y="160" font-size="12" fill="#BA8B55" font-weight="700">03 / LOCAL</text><text x="684" y="185" font-size="19" fill="#F2EFE7" font-weight="700">Record &amp; deliver</text><text x="684" y="211" font-size="14" fill="#D7D4CB" font-weight="400">Checkpoint and evidence</text><text x="684" y="232" font-size="14" fill="#D7D4CB" font-weight="400">Usage accounting</text><text x="684" y="253" font-size="14" fill="#D7D4CB" font-weight="400">TXT / DOCX / PDF</text><path d="M292 210L344 210" fill="none" stroke="#BA8B55" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 210L662 210" fill="none" stroke="#BA8B55" stroke-width="2" marker-end="url(#arrow)"/><path d="M321 124V299M639 124V299" stroke="#74776F" stroke-dasharray="4 6"/><text x="32" y="324" font-size="14" fill="#BA8B55" font-weight="700">Source file remains read-only.</text><text x="350" y="324" font-size="14" fill="#BA8B55" font-weight="700">Text crosses the network.</text><text x="668" y="324" font-size="14" fill="#BA8B55" font-weight="700">Run artifacts are not encrypted.</text></g></svg>