<svg xmlns="http://www.w3.org/2000/svg" width="960" height="433" viewBox="0 0 960 433" role="img" aria-label="A resumable stage lifecycle"><title>A resumable stage lifecycle</title><rect width="960" height="433" rx="16" fill="#171B1C"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" font-size="13" letter-spacing="2" font-weight="700" fill="#BA8B55">CICERO / TECHNICAL REFERENCE</text><text x="32" y="78" font-size="26" font-weight="700" fill="#F2EFE7">A resumable stage lifecycle</text><text x="32" y="105" font-size="15" fill="#C8C6BF">Durable progress is recorded separately from provider request attempts</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#BA8B55"/></marker></defs><rect x="32" y="135" width="260" height="137" rx="8" fill="#222829" stroke="#515551"/><text x="48" y="160" font-size="12" fill="#BA8B55" font-weight="700">01 / BEFORE REQUEST</text><text x="48" y="185" font-size="19" fill="#F2EFE7" font-weight="700">Persist intent</text><text x="48" y="211" font-size="14" fill="#D7D4CB" font-weight="400">Record unfinished stage</text><text x="48" y="232" font-size="14" fill="#D7D4CB" font-weight="400">Start usage attempt</text><rect x="350" y="135" width="260" height="137" rx="8" fill="#222829" stroke="#515551"/><text x="366" y="160" font-size="12" fill="#BA8B55" font-weight="700">02 / DURING REQUEST</text><text x="366" y="185" font-size="19" fill="#F2EFE7" font-weight="700">Receive &amp; validate</text><text x="366" y="211" font-size="14" fill="#D7D4CB" font-weight="400">Retain unreviewed evidence</text><text x="366" y="232" font-size="14" fill="#D7D4CB" font-weight="400">Check response / verdict</text><rect x="668" y="135" width="260" height="137" rx="8" fill="#222829" stroke="#515551"/><text x="684" y="160" font-size="12" fill="#BA8B55" font-weight="700">03 / AFTER VALIDATION</text><text x="684" y="185" font-size="19" fill="#F2EFE7" font-weight="700">Commit stage</text><text x="684" y="211" font-size="14" fill="#D7D4CB" font-weight="400">Save validated response</text><text x="684" y="232" font-size="14" fill="#D7D4CB" font-weight="400">Clear pending intent</text><path d="M292 202L344 202" fill="none" stroke="#BA8B55" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 202L662 202" fill="none" stroke="#BA8B55" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 272V292H169V307" stroke="#BA8B55" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="32" y="311" width="896" height="92" rx="8" fill="#242A2A" stroke="#BA8B55"/><text x="50" y="337" font-size="12" fill="#BA8B55" font-weight="700">INTERRUPTION OR VALIDATION FAILURE</text><text x="50" y="363" font-size="16" fill="#F2EFE7" font-weight="700">Partial output and completed stages remain available; pending work is not silently replayed.</text><text x="50" y="386" font-size="14" fill="#D7D4CB" font-weight="400">Resume checks identity and requires consent before retrying unfinished work.</text></g></svg>